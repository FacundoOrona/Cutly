spring.application.name=cutly

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cutly_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Desarrollo local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Migraciones
spring.flyway.enabled=false

# Seguridad JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Aprovisionamiento inicial de SUPER_ADMIN
app.bootstrap-super-admin.nombre=${SUPER_ADMIN_NOMBRE:}
app.bootstrap-super-admin.apellido=${SUPER_ADMIN_APELLIDO:}
app.bootstrap-super-admin.dni=${SUPER_ADMIN_DNI:}
app.bootstrap-super-admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap-super-admin.password=${SUPER_ADMIN_PASSWORD:}

