spring.application.name=cutly

spring.datasource.url=jdbc:mysql://localhost:3306/cutly_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Solo para desarrollo local. En producción configurá JWT_SECRET con una clave propia de 32+ caracteres.
security.jwt.secret=${JWT_SECRET:clave-local-desarrollo-jwt-segura-2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false

# Opcional: crea el super admin inicial si se configuran todas estas variables.
app.bootstrap-super-admin.nombre=${SUPER_ADMIN_NOMBRE:dev}
app.bootstrap-super-admin.apellido=${SUPER_ADMIN_APELLIDO:dev}
app.bootstrap-super-admin.dni=${SUPER_ADMIN_DNI:99999999}
app.bootstrap-super-admin.email=${SUPER_ADMIN_EMAIL:dev@gmail.com}
app.bootstrap-super-admin.password=${SUPER_ADMIN_PASSWORD:dev123456}
